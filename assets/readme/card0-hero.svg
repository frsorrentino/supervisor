<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" xml:space="preserve">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151a33"/><stop offset="1" stop-color="#0a0e1c"/></linearGradient>
  <marker id="m" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 z" fill="#3ddc84"/></marker>
  <clipPath id="round"><circle cx="0" cy="0" r="132"/></clipPath></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><text x="70" y="100" fill="#ffffff" font-size="52" font-weight="800" text-anchor="start">One master runs all the others.</text><text x="70" y="146" fill="#b9c7e8" font-size="26" font-weight="500" text-anchor="start">Parallel sessions, one per project — terminal and wrist</text><rect x="70" y="200" width="420" height="330" rx="14" fill="#101733" stroke="#3b4d78"/><circle cx="108" cy="232" r="11" fill="#ff4d4d"/><text x="130" y="240" fill="#ffffff" font-size="26" font-weight="800" text-anchor="start">master</text><text x="96" y="272" fill="#9aa7c7" font-size="18" font-weight="500" text-anchor="start">the session of the root folder:</text><text x="96" y="296" fill="#9aa7c7" font-size="18" font-weight="500" text-anchor="start">launches, watches, answers,</text><text x="96" y="320" fill="#9aa7c7" font-size="18" font-weight="500" text-anchor="start">closes the rest</text><text x="96" y="372" fill="#9ad1ff" font-size="17" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">$ supervisor sessions</text><text x="96" y="400" fill="#9ad1ff" font-size="17" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">$ supervisor talk ledger-api "…"</text><text x="96" y="428" fill="#9ad1ff" font-size="17" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">$ supervisor answer ledger-api 1</text><text x="96" y="456" fill="#9ad1ff" font-size="17" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">$ supervisor restore</text><text x="96" y="500" fill="#9aa7c7" font-size="18" font-weight="500" text-anchor="start">your phone talks to it, too</text><rect x="556" y="218" width="230" height="64" rx="14" fill="#0b1020" stroke="#2f3f63"/><rect x="568" y="238" width="24" height="24" rx="3" fill="#3ddc84"/><text x="602" y="257" fill="#ffffff" font-size="20" font-weight="700" text-anchor="start">atlas-shop</text><text x="776" y="257" fill="#ffd43b" font-size="22" font-weight="800" text-anchor="end">▶</text><line x1="498" y1="250" x2="548" y2="250" stroke="#3ddc84" stroke-width="3" marker-end="url(#m)"/><rect x="556" y="298" width="230" height="64" rx="14" fill="#0b1020" stroke="#2f3f63"/><circle cx="580" cy="330" r="12" fill="#ff8c42"/><text x="602" y="337" fill="#ffffff" font-size="20" font-weight="700" text-anchor="start">field-notes</text><text x="776" y="337" fill="#3ddc84" font-size="22" font-weight="800" text-anchor="end">✓</text><line x1="498" y1="330" x2="548" y2="330" stroke="#3ddc84" stroke-width="3" marker-end="url(#m)"/><rect x="556" y="378" width="230" height="64" rx="14" fill="#0b1020" stroke="#2f3f63"/><rect x="568" y="398" width="24" height="24" rx="3" fill="#5aa7ff"/><text x="602" y="417" fill="#ffffff" font-size="20" font-weight="700" text-anchor="start">ledger-api</text><text x="776" y="417" fill="#ff6b6b" font-size="22" font-weight="800" text-anchor="end">?</text><line x1="498" y1="410" x2="548" y2="410" stroke="#3ddc84" stroke-width="3" marker-end="url(#m)"/><rect x="556" y="458" width="230" height="64" rx="14" fill="#0b1020" stroke="#2f3f63"/><circle cx="580" cy="490" r="12" fill="#a78bfa"/><text x="602" y="497" fill="#ffffff" font-size="20" font-weight="700" text-anchor="start">orbit-docs</text><text x="776" y="497" fill="#8a94b3" font-size="22" font-weight="800" text-anchor="end">✗</text><line x1="498" y1="490" x2="548" y2="490" stroke="#3ddc84" stroke-width="3" marker-end="url(#m)"/><circle cx="960" cy="360" r="158" fill="#1b1f2a" stroke="#3a4152" stroke-width="3"/><rect x="1114" y="338" width="12" height="44" rx="5" fill="#3a4152"/><clipPath id="clip960360"><circle cx="960" cy="360" r="140"/></clipPath><image x="820" y="220" width="280" height="280" href="watch/sessions.png" clip-path="url(#clip960360)"/><text x="960" y="546" fill="#9aa7c7" font-size="16" font-weight="500" text-anchor="middle">the watch app · beta, build it yourself</text><text x="70" y="592" fill="#9aa7c7" font-size="20" font-weight="500" text-anchor="start">launch, list, talk, answer, restart, restore, tile — tmux underneath, your wrist on top</text></svg>