<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" xml:space="preserve">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a10"/><stop offset="1" stop-color="#160d08"/></linearGradient>
  <marker id="m" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 z" fill="#3ddc84"/></marker>
  <clipPath id="round"><circle cx="0" cy="0" r="132"/></clipPath></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><text x="70" y="100" fill="#ffffff" font-size="52" font-weight="800" text-anchor="start">Survive a reboot with everything.</text><text x="70" y="146" fill="#b9c7e8" font-size="26" font-weight="500" text-anchor="start">Registry + last good set: restore proposes all, with a date</text><rect x="70" y="200" width="470" height="320" rx="14" fill="#0b1020" stroke="#4a3320"/><text x="96" y="242" fill="#ffb27a" font-size="22" font-weight="700" text-anchor="start">before the reboot</text><circle cx="112" cy="278" r="9" fill="#ff4d4d"/><text x="132" y="285" fill="#e8eefc" font-size="21" font-weight="500" text-anchor="start">master</text><rect x="103" y="303" width="18" height="18" rx="3" fill="#3ddc84"/><text x="132" y="319" fill="#e8eefc" font-size="21" font-weight="500" text-anchor="start">atlas-shop</text><circle cx="112" cy="346" r="9" fill="#ff8c42"/><text x="132" y="353" fill="#e8eefc" font-size="21" font-weight="500" text-anchor="start">field-notes</text><rect x="103" y="371" width="18" height="18" rx="3" fill="#5aa7ff"/><text x="132" y="387" fill="#e8eefc" font-size="21" font-weight="500" text-anchor="start">ledger-api</text><circle cx="112" cy="414" r="9" fill="#a78bfa"/><text x="132" y="421" fill="#e8eefc" font-size="21" font-weight="500" text-anchor="start">orbit-docs</text><text x="96" y="470" fill="#9aa7c7" font-size="17" font-weight="500" text-anchor="start">two windows closed by hand → the registry</text><text x="96" y="494" fill="#9aa7c7" font-size="17" font-weight="500" text-anchor="start">shrank to 3; the last good set kept 5</text><line x1="560" y1="360" x2="640" y2="360" stroke="#3ddc84" stroke-width="3" marker-end="url(#m)"/><rect x="660" y="200" width="470" height="320" rx="14" fill="#0b1020" stroke="#4a3320"/><text x="686" y="242" fill="#ffb27a" font-size="22" font-weight="700" text-anchor="start">the first shell asks</text><text x="686" y="280" fill="#e8eefc" font-size="19" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">to restore (5), registry of 09:51:</text><text x="686" y="316" fill="#e8eefc" font-size="18" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">master       registry 09:51</text><text x="686" y="344" fill="#e8eefc" font-size="18" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">atlas-shop   registry 09:51</text><text x="686" y="372" fill="#e8eefc" font-size="18" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">field-notes  registry 09:51</text><text x="686" y="400" fill="#ffb27a" font-size="18" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">ledger-api   snapshot 09:40</text><text x="686" y="428" fill="#ffb27a" font-size="18" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">orbit-docs   snapshot 09:12</text><text x="686" y="470" fill="#e8eefc" font-size="19" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">restore? [Y/n]</text><text x="686" y="498" fill="#3ddc84" font-size="16" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">ok: all five back, each with its conversation</text><text x="70" y="592" fill="#9aa7c7" font-size="20" font-weight="500" text-anchor="start">each one restarts with --continue; only an explicit close shrinks the last good set</text></svg>