<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" xml:space="preserve">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2a2a"/><stop offset="1" stop-color="#08161a"/></linearGradient>
  <marker id="m" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 z" fill="#3ddc84"/></marker>
  <clipPath id="round"><circle cx="0" cy="0" r="132"/></clipPath></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><text x="70" y="100" fill="#ffffff" font-size="52" font-weight="800" text-anchor="start">From your wrist.</text><text x="70" y="146" fill="#b9c7e8" font-size="26" font-weight="500" text-anchor="start">The Wear OS app: see every session, answer, follow</text><text x="70" y="220" fill="#e8eefc" font-size="20" font-weight="500" text-anchor="start">•  the list: every session, its state and its icon</text><text x="70" y="260" fill="#e8eefc" font-size="20" font-weight="500" text-anchor="start">•  tap one → its card: state, outcome, next step</text><text x="70" y="300" fill="#e8eefc" font-size="20" font-weight="500" text-anchor="start">•  a question → its options, one tap answers</text><text x="70" y="340" fill="#e8eefc" font-size="20" font-weight="500" text-anchor="start">•  an old list says so, it never looks live</text><text x="70" y="380" fill="#e8eefc" font-size="20" font-weight="500" text-anchor="start">•  paired once: a 6-digit code from your PC</text><text x="70" y="420" fill="#e8eefc" font-size="20" font-weight="500" text-anchor="start">•  it buzzes for questions, outcomes</text><text x="94" y="446" fill="#e8eefc" font-size="20" font-weight="500" text-anchor="start">and sessions that end</text><circle cx="679" cy="350" r="92" fill="#1b1f2a" stroke="#3a4152" stroke-width="3"/><rect x="767" y="328" width="12" height="44" rx="5" fill="#3a4152"/><clipPath id="clip679350"><circle cx="679" cy="350" r="74"/></clipPath><image x="605" y="276" width="148" height="148" href="watch/card.png" clip-path="url(#clip679350)"/><text x="679" y="470" fill="#9aa7c7" font-size="16" font-weight="500" text-anchor="middle">a session's card</text><circle cx="884" cy="350" r="92" fill="#1b1f2a" stroke="#3a4152" stroke-width="3"/><rect x="972" y="328" width="12" height="44" rx="5" fill="#3a4152"/><clipPath id="clip884350"><circle cx="884" cy="350" r="74"/></clipPath><image x="810" y="276" width="148" height="148" href="watch/question.png" clip-path="url(#clip884350)"/><text x="884" y="470" fill="#9aa7c7" font-size="16" font-weight="500" text-anchor="middle">a question</text><circle cx="1089" cy="350" r="92" fill="#1b1f2a" stroke="#3a4152" stroke-width="3"/><rect x="1177" y="328" width="12" height="44" rx="5" fill="#3a4152"/><clipPath id="clip1089350"><circle cx="1089" cy="350" r="74"/></clipPath><image x="1015" y="276" width="148" height="148" href="watch/quota.png" clip-path="url(#clip1089350)"/><text x="1089" y="470" fill="#9aa7c7" font-size="16" font-weight="500" text-anchor="middle">the quota</text><rect x="690" y="158" width="410" height="50" rx="18" fill="#3b2a0a" stroke="#ffd43b"/><text x="895" y="179" fill="#ffd43b" font-size="13" font-weight="700" text-anchor="middle">beta · github.com/frsorrentino/supervisor-app</text><text x="895" y="199" fill="#f5dfa0" font-size="13" font-weight="500" text-anchor="middle">build it with your own Firebase: the relay runs on your PC</text><text x="70" y="592" fill="#9aa7c7" font-size="20" font-weight="500" text-anchor="start">the native Wear OS app, screens drawn from its real code on the demo set</text></svg>