  <rect width="1200" height="630" fill="url(#bg)"/><text x="70" y="100" fill="#ffffff" font-size="52" font-weight="800" text-anchor="start">Doctor, for both accounts.</text><text x="70" y="146" fill="#b9c7e8" font-size="26" font-weight="500" text-anchor="start">Cache, hooks, relay, cron: each line says what to do</text><rect x="70" y="200" width="1060" height="330" rx="14" fill="#0b1020" stroke="#4b3a7a"/><text x="96" y="240" fill="#9ad1ff" font-size="22" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">$ supervisor doctor</text><text x="96" y="282" fill="#3ddc84" font-size="18" font-weight="800" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">PASS</text><text x="160" y="282" fill="#e8eefc" font-size="17" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">plugin_ok — account «personal»: supervisor 0.3.8 in the cache</text><text x="96" y="316" fill="#3ddc84" font-size="18" font-weight="800" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">PASS</text><text x="160" y="316" fill="#e8eefc" font-size="17" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">plugin_ok — account «work»: supervisor 0.3.8 in the cache</text><text x="96" y="350" fill="#3ddc84" font-size="18" font-weight="800" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">PASS</text><text x="160" y="350" fill="#e8eefc" font-size="17" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">hooks — SessionStart, Stop, PermissionRequest wired in both settings</text><text x="96" y="384" fill="#3ddc84" font-size="18" font-weight="800" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">PASS</text><text x="160" y="384" fill="#e8eefc" font-size="17" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">relay — serve alive (pid 7737), last push 19:20, 0 reconnections</text><text x="96" y="418" fill="#ffd43b" font-size="18" font-weight="800" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">WARN</text><text x="160" y="418" fill="#e8eefc" font-size="17" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">cron — registry, guard present; night 02:00 missing → night install</text><text x="96" y="452" fill="#3ddc84" font-size="18" font-weight="800" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">PASS</text><text x="160" y="452" fill="#e8eefc" font-size="17" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">shell — wrappers for both accounts, no helper needed (T76)</text><text x="96" y="500" fill="#ffd43b" font-size="20" font-weight="800" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">0 FAIL, 1 WARN</text><text x="70" y="592" fill="#9aa7c7" font-size="20" font-weight="500" text-anchor="start">run it after every update: hooks run from the cache until the session restarts</text></svg>