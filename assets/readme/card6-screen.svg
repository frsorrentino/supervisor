<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" xml:space="preserve">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151a33"/><stop offset="1" stop-color="#0d1120"/></linearGradient>
  <marker id="m" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 z" fill="#3ddc84"/></marker>
  <clipPath id="round"><circle cx="0" cy="0" r="132"/></clipPath></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><text x="70" y="100" fill="#ffffff" font-size="52" font-weight="800" text-anchor="start">Your screen, arranged.</text><text x="70" y="146" fill="#b9c7e8" font-size="26" font-weight="500" text-anchor="start">tile, merge, move, layout — app windows, no start tab</text><rect x="70" y="200" width="620" height="330" rx="10" fill="#0b1020" stroke="#3b4d78"/><rect x="80" y="210" width="360" height="310" rx="6" fill="#141c30" stroke="#324472"/><circle cx="100" cy="226" r="7" fill="#ff4d4d"/><text x="114" y="231" fill="#e8eefc" font-size="15" font-weight="700" text-anchor="start">master</text><rect x="450" y="210" width="230" height="70" rx="6" fill="#141c30" stroke="#324472"/><rect x="462" y="220" width="12" height="12" rx="3" fill="#3ddc84"/><text x="480" y="231" fill="#e8eefc" font-size="14" font-weight="700" text-anchor="start">atlas-shop</text><rect x="450" y="288" width="230" height="70" rx="6" fill="#141c30" stroke="#324472"/><circle cx="468" cy="304" r="6" fill="#ff8c42"/><text x="480" y="309" fill="#e8eefc" font-size="14" font-weight="700" text-anchor="start">field-notes</text><rect x="450" y="366" width="230" height="70" rx="6" fill="#141c30" stroke="#324472"/><rect x="462" y="376" width="12" height="12" rx="3" fill="#5aa7ff"/><text x="480" y="387" fill="#e8eefc" font-size="14" font-weight="700" text-anchor="start">ledger-api</text><rect x="450" y="444" width="230" height="70" rx="6" fill="#141c30" stroke="#324472"/><circle cx="468" cy="460" r="6" fill="#a78bfa"/><text x="480" y="465" fill="#e8eefc" font-size="14" font-weight="700" text-anchor="start">orbit-docs</text><text x="70" y="555" fill="#9ad1ff" font-size="18" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">$ supervisor tile   → 5 windows: master 60 % left, four stacked right</text><rect x="720" y="200" width="410" height="330" rx="14" fill="#0b1020" stroke="#2f3f63"/><text x="746" y="240" fill="#ffffff" font-size="20" font-weight="700" text-anchor="start">tile / merge / move / layout</text><text x="746" y="282" fill="#e8eefc" font-size="18" font-weight="500" text-anchor="start">tile: one app window per session</text><text x="746" y="316" fill="#e8eefc" font-size="18" font-weight="500" text-anchor="start">merge: all of them as tabs of one window</text><text x="746" y="350" fill="#e8eefc" font-size="18" font-weight="500" text-anchor="start">move destra: to another monitor</text><text x="746" y="384" fill="#e8eefc" font-size="18" font-weight="500" text-anchor="start">layout save|restore mattina</text><text x="746" y="418" fill="#e8eefc" font-size="18" font-weight="500" text-anchor="start">no start tab beside a session</text><text x="746" y="452" fill="#e8eefc" font-size="18" font-weight="500" text-anchor="start">odd count + master: master-primary</text><text x="70" y="592" fill="#9aa7c7" font-size="20" font-weight="500" text-anchor="start">ChromeOS Terminal via chrome-bridge: tabs never move, so tile opens and merge duplicates</text></svg>