<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" xml:space="preserve">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2a2a"/><stop offset="1" stop-color="#08161a"/></linearGradient>
  <marker id="m" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 z" fill="#3ddc84"/></marker>
  <clipPath id="round"><circle cx="0" cy="0" r="132"/></clipPath></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><text x="70" y="100" fill="#ffffff" font-size="52" font-weight="800" text-anchor="start">Talk. Answer its question.</text><text x="70" y="146" fill="#b9c7e8" font-size="26" font-weight="500" text-anchor="start">From another session, from your phone, on either account</text><rect x="70" y="200" width="580" height="160" rx="14" fill="#0b1020" stroke="#2f6b55"/><text x="96" y="240" fill="#9ad1ff" font-size="19" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">$ supervisor talk ledger-api "deploy done?"</text><text x="96" y="280" fill="#e8eefc" font-size="19" font-weight="500" text-anchor="start">delivered to ledger-api's own inbox; the answer is read</text><text x="96" y="306" fill="#e8eefc" font-size="19" font-weight="500" text-anchor="start">back from its transcript</text><text x="96" y="340" fill="#3ddc84" font-size="19" font-weight="600" text-anchor="start">→ «yes, live since 14:02, cache purged»</text><rect x="70" y="376" width="580" height="184" rx="14" fill="#0b1020" stroke="#2f6b55"/><text x="96" y="414" fill="#9ad1ff" font-size="19" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">$ supervisor answer ledger-api --show</text><text x="96" y="446" fill="#e8eefc" font-size="19" font-weight="500" text-anchor="start">«ledger-api» asks — Deploy: deploy now?</text><text x="96" y="472" fill="#e8eefc" font-size="19" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">  ❯ 1. yes</text><text x="96" y="496" fill="#e8eefc" font-size="19" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">    2. no</text><text x="96" y="524" fill="#9ad1ff" font-size="19" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">$ supervisor answer ledger-api 1</text><text x="96" y="548" fill="#3ddc84" font-size="18" font-weight="600" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">  → answered 1. yes</text><circle cx="900" cy="318" r="136" fill="#1b1f2a" stroke="#3a4152" stroke-width="3"/><rect x="1032" y="296" width="12" height="44" rx="5" fill="#3a4152"/><clipPath id="clip900318"><circle cx="900" cy="318" r="118"/></clipPath><image x="782" y="200" width="236" height="236" href="watch/question.png" clip-path="url(#clip900318)"/><text x="900" y="482" fill="#9aa7c7" font-size="16" font-weight="500" text-anchor="middle">the same question on the watch</text><text x="900" y="530" fill="#9aa7c7" font-size="16" font-weight="500" text-anchor="middle">an inbox message never unblocks a dialog:</text><text x="900" y="552" fill="#9aa7c7" font-size="16" font-weight="500" text-anchor="middle">answer does</text><text x="70" y="592" fill="#9aa7c7" font-size="20" font-weight="500" text-anchor="start">same registry → native channel; otherwise the tmux pane, after checking for typed text</text></svg>