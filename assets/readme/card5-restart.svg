<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" xml:space="preserve">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1033"/><stop offset="1" stop-color="#0c0818"/></linearGradient>
  <marker id="m" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 z" fill="#3ddc84"/></marker>
  <clipPath id="round"><circle cx="0" cy="0" r="132"/></clipPath></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><text x="70" y="100" fill="#ffffff" font-size="52" font-weight="800" text-anchor="start">Restart in place, keep talking.</text><text x="70" y="146" fill="#b9c7e8" font-size="26" font-weight="500" text-anchor="start">Hooks and plugins load at startup: arm, finish, come back</text><rect x="70" y="200" width="500" height="330" rx="14" fill="#0b1020" stroke="#4b3a7a"/><text x="96" y="240" fill="#9ad1ff" font-size="22" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">$ supervisor restart arm</text><text x="96" y="280" fill="#e8eefc" font-size="18" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">restart armed: tmux «atlas-shop» (pid 4812)</text><text x="96" y="306" fill="#9aa7c7" font-size="18" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">  fires at the end of this turn</text><text x="96" y="350" fill="#e8eefc" font-size="18" font-weight="500" text-anchor="start">one flag per session: eight sessions</text><text x="96" y="374" fill="#e8eefc" font-size="18" font-weight="500" text-anchor="start">can arm in the same minute</text><text x="96" y="418" fill="#9ad1ff" font-size="22" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">$ supervisor restart list</text><text x="96" y="452" fill="#e8eefc" font-size="17" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">atlas-shop   13:10 --clean</text><text x="96" y="478" fill="#e8eefc" font-size="17" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">ledger-api   13:10</text><text x="96" y="504" fill="#e8eefc" font-size="17" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">field-notes  13:11 --switch-account work</text><rect x="630" y="200" width="500" height="330" rx="14" fill="#0b1020" stroke="#4b3a7a"/><text x="656" y="240" fill="#c9b8ff" font-size="20" font-weight="700" text-anchor="start">the Stop hook, at the end of the turn</text><text x="656" y="288" fill="#e8eefc" font-size="18" font-weight="500" text-anchor="start">1  /exit to the session (Esc first)</text><text x="656" y="320" fill="#e8eefc" font-size="18" font-weight="500" text-anchor="start">2  wait, then TERM, then KILL — never mid-turn</text><text x="656" y="352" fill="#e8eefc" font-size="18" font-weight="500" text-anchor="start">3  free the tmux name</text><text x="656" y="384" fill="#e8eefc" font-size="18" font-weight="500" text-anchor="start">4  launch again with --continue</text><text x="656" y="416" fill="#e8eefc" font-size="18" font-weight="500" text-anchor="start">5  a new session id: a new entry in the app</text><text x="656" y="470" fill="#9aa7c7" font-size="17" font-weight="500" text-anchor="start">--clean: fresh context, memory intact</text><text x="656" y="496" fill="#9aa7c7" font-size="17" font-weight="500" text-anchor="start">--switch-account: same transcript, the other org</text><text x="70" y="592" fill="#9aa7c7" font-size="20" font-weight="500" text-anchor="start">a kill from inside a tool lands mid-turn: the Stop hook is the only safe instant</text></svg>